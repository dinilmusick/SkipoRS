name: SkipoRS Rust environment contract parity
on:
  push:
    branches: [main, feat/rust-environment-governance-v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-contract:
    name: Rust contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Compile and execute canonical fixture tests
        run: cargo test --all-targets
      - name: Enforce Clippy warnings
        run: cargo clippy --all-targets -- -D warnings
