name: Rust scaffold contract parity
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test fail-closed environment and scaffold contracts
        run: cargo test --all-targets
      - name: Verify generated Rust application
        run: cargo run --example scaffold_consumer
      - name: Check warnings
        run: cargo clippy --all-targets -- -D warnings
